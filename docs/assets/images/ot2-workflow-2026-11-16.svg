<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc"><title id="title">Geometry-aware BCA workflow</title><desc id="desc">A conceptual workflow for planning, positioning, liquid handling, and assay evaluation. Not experimental data.</desc><rect width="1280" height="410" rx="12" fill="#e8ede4"/><text x="50" y="55" fill="#64716a" font-size="14" letter-spacing="3" font-family="Arial,sans-serif">FROM BENCH STEPS TO EXPLICIT DECISIONS</text><g stroke="#bac8bc" stroke-width="2"><path d="M295 205h35M605 205h35M915 205h35"/></g><g fill="#fffefb" stroke="#cbd4ca"><rect x="40" y="105" width="255" height="220" rx="5"/><rect x="350" y="105" width="255" height="220" rx="5"/><rect x="660" y="105" width="255" height="220" rx="5"/><rect x="970" y="105" width="270" height="220" rx="5"/></g><g font-family="Arial,sans-serif"><g fill="#c55b38" font-size="15"><text x="65" y="142">01 / PLAN</text><text x="375" y="142">02 / POSITION</text><text x="685" y="142">03 / EXECUTE</text><text x="995" y="142">04 / EVALUATE</text></g><g fill="#183c37" font-size="24" font-weight="bold"><text x="65" y="190">Dilutions &amp; volumes</text><text x="375" y="190">Liquid-height logic</text><text x="685" y="190">Controlled transfers</text><text x="995" y="190">Replicates &amp; curves</text></g><g fill="#64716a" font-size="16"><text x="65" y="228">Standards, reagent, tips</text><text x="65" y="257">Pre-run consistency checks</text><text x="375" y="228">Tracked volume + geometry</text><text x="375" y="257">Bottom-clearance limits</text><text x="685" y="228">20 µL sample / 180 µL WR</text><text x="685" y="257">Eight-channel accounting</text><text x="995" y="228">Within-plate repeatability</text><text x="995" y="257">Context before conclusions</text></g></g><text x="50" y="373" fill="#64716a" font-size="14" font-family="Arial,sans-serif">Conceptual workflow illustration · no measured values are represented by the diagram.</text></svg>